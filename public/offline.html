<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#145214">
    <title>Tidak Terhubung - Bazar Amal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            align-items: center;
            background: #f5f5f4;
            color: #292524;
            display: flex;
            font-family: system-ui, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 1.5rem;
            text-align: center;
        }
        main {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 18px 45px rgb(20 82 20 / 12%);
            max-width: 26rem;
            padding: 2.5rem 2rem;
        }
        img { height: 5rem; width: 5rem; }
        h1 { color: #145214; font-size: 1.5rem; margin: 1rem 0 .5rem; }
        p { line-height: 1.6; margin: 0; }
        button {
            background: #145214;
            border: 0;
            border-radius: 999px;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            margin-top: 1.5rem;
            padding: .75rem 1.25rem;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="Bazar Amal">
        <h1>Belum terhubung ke internet</h1>
        <p>Periksa koneksi Anda, lalu coba buka kembali halaman Bazar Amal.</p>
        <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
